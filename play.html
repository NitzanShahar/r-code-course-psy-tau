<header class="hdr">

</header><main class="card player"><a class="back" href="index.html" id="back">→ חזרה</a><h1 class="ptitle" id="ptitle"></h1><video id="vid" controls controlsList="nodownload" disablePictureInPicture playsinline preload="metadata"></video></main><footer class="foot"><img class="flogo" src="assets/tau-logo.png" alt=""><b>קורס R למתחילים</b><span>בית הספר למדעי הפסיכולוגיה · אוניברסיטת תל אביב · תשפ״ז</span><details class="tlog"><summary>כניסת מתרגלים</summary><form class="tlogf"><input type="password" autocomplete="off" aria-label="סיסמה" placeholder="סיסמה"><button type="submit">כניסה</button><span class="terr" hidden>סיסמה שגויה</span></form></details></footer>
</div>
<script>
// the site's player: a local video, no download button, no right-click menu (makes saving harder, not impossible)
(function(){
  var q=new URLSearchParams(location.search), v=q.get('v')||'', t=q.get('t')||'';
  var vid=document.getElementById('vid');
  if(/^files\/[^?#]+\.mp4$/i.test(v) && v.indexOf('..')<0){ vid.src=''+v; }
  document.getElementById('ptitle').textContent=t;
  if(t) document.title=t+' · '+document.title;
  vid.addEventListener('contextmenu',function(e){e.preventDefault();});
  var b=document.getElementById('back');
  if(document.referrer && document.referrer.indexOf(location.host)>=0){ b.href=document.referrer; }
})();
</script>
